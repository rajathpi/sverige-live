name: Update power data

# Svenska kraftnät's control room API sends no CORS header, so a browser cannot
# read it. This job copies today's figures to the svk-data branch, which the
# pages read through raw.githubusercontent.com. The branch is one force-pushed
# commit, so main's history and the Pages deploy stay untouched.
on:
  schedule:
    - cron: "*/15 * * * *"   # SvK publishes 15-minute values
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svk-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch today's control room data
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=Europe/Stockholm date +%F)
          base=https://www.svk.se/services/controlroom/v2
          get() { curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 -A "sverige-live (+https://github.com/${{ github.repository }})" "$base/$1" -o "out/$2"; }
          mkdir out
          if get "production?date=$day&countryCode=SE" production.json && get "situation?date=$day&biddingArea=SE3" situation.json; then
            jq -e '.Data | length > 0' out/production.json > /dev/null
            jq -e '.Data' out/situation.json > /dev/null
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # svk.se's Cloudflare refuses some runner IPs; a skipped run only matters once the copy goes stale.
          last=$(gh api "repos/${{ github.repository }}/commits/svk-data" --jq .commit.committer.date)
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
          if [ "$age" -lt 120 ]; then
            echo "::warning::svk.se refused this run; the copy from $age minutes ago stays up."
            exit 0
          fi
          echo "::error::svk.se has refused every run for $age minutes."
          exit 1

      - name: Publish to the svk-data branch
        if: steps.fetch.outputs.ok == 'true'
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b svk-data
          git add .
          git -c user.name=sverige-live-bot -c user.email=sverige-live-bot@users.noreply.github.com \
            commit -qm "svk data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" svk-data
