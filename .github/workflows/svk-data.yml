name: Update power data

# Svenska kraftnät's control room API sends no CORS header, so a browser cannot
# read it. This job copies today's figures to the svk-data branch, which the
# pages read through raw.githubusercontent.com. The branch is one force-pushed
# commit, so main's history and the Pages deploy stay untouched.
on:
  schedule:
    - cron: "*/15 * * * *"   # SvK publishes 15-minute values
  workflow_dispatch:
  push:
    branches: [fix/svk-cors]

permissions:
  contents: write

concurrency:
  group: svk-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch today's control room data
        run: |
          day=$(TZ=Europe/Stockholm date +%F)
          base=https://www.svk.se/services/controlroom/v2
          mkdir out
          curl -fsS --retry 3 --max-time 30 "$base/production?date=$day&countryCode=SE" -o out/production.json
          curl -fsS --retry 3 --max-time 30 "$base/situation?date=$day&biddingArea=SE3" -o out/situation.json
          jq -e '.Data | length > 0' out/production.json
          jq -e '.Data' out/situation.json > /dev/null

      - name: Publish to the svk-data branch
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b svk-data
          git add .
          git -c user.name=sverige-live-bot -c user.email=sverige-live-bot@users.noreply.github.com \
            commit -qm "svk data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" svk-data
